<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css" type="text/css"/>
    <meta name="google-signin-client_id" content="510712017925-t2ptvhq0cktg8l1mlofcfrjrk8hge60m.apps.googleusercontent.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">Student Login</h3>

                <!-- Normal login form -->
                <form action="LoginServlet" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>

                <!-- Google login -->
                <div class="text-center mt-4">
                    <div id="g_id_onload"
                         data-client_id="510712017925-t2ptvhq0cktg8l1mlofcfrjrk8hge60m.apps.googleusercontent.com"
                         data-callback="handleCredentialResponse"
                         data-auto_prompt="false">
                    </div>

                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="sign_in_with"
                         data-size="large"
                         data-logo_alignment="left">
                    </div>
                </div>

                <!-- Password links -->
                <div class="mt-3 text-center">
                    <a href="forgot.html" class="text-decoration-none me-3"></a>
                    <a href="change.html" class="text-decoration-none"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Google sign-in callback handler -->
<script>
    function handleCredentialResponse(response) {
        // Yeh form Google ID Token ko backend me POST karega
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "LoginServlet";

        const tokenField = document.createElement("input");
        tokenField.type = "hidden";
        tokenField.name = "id_token"; // ✅ Backend expects this
        tokenField.value = response.credential;

        form.appendChild(tokenField);
        document.body.appendChild(form);
        form.submit();
    }
</script>

</body>
</html>
